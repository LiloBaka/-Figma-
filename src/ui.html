<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Illustration Builder</title><style>
body{margin:0;color:#1e1e1e;font:12px/1.4 Inter,sans-serif}main{display:grid;gap:10px;padding:16px}h1{font-size:18px;margin:0}h2{font-size:14px;margin:0}#status{color:#0f7b3b;margin:0}.controls,.variants,.scene-actions,.coordinates{display:flex;flex-wrap:wrap;gap:5px}.controls label,.coordinates label{display:grid;gap:2px}.controls select{min-width:105px}#search{border:1px solid #b3b3b3;border-radius:6px;box-sizing:border-box;font:inherit;padding:8px;width:100%}#catalog{display:grid;gap:8px;max-height:175px;overflow-y:auto}.asset{align-items:center;border:1px solid #e0e0e0;border-radius:6px;cursor:pointer;display:grid;gap:8px;grid-template-columns:82px 1fr;padding:8px}.asset[aria-selected="true"],.scene-item.selected{border-color:#7864d7;box-shadow:0 0 0 1px #7864d7}.preview{height:58px;object-fit:contain;width:82px}.asset-name{font-weight:600}.tags{color:#666;margin:2px 0 6px}.variant{background:#f4f3fb;border:0;border-radius:4px;color:#3e3472;cursor:pointer;font:inherit;padding:4px 6px}.variant[aria-pressed="true"]{background:#7864d7;color:#fff}#insert{background:#7864d7;border:0;border-radius:6px;color:#fff;cursor:pointer;font:inherit;font-weight:600;padding:10px;width:100%}#insert:disabled{background:#c9c5df;cursor:not-allowed}#scene{border-top:1px solid #e0e0e0;padding-top:10px}.scene-item{border:1px solid #e0e0e0;border-radius:5px;display:grid;gap:5px;margin:6px 0;padding:6px}.coordinates input{width:55px}.scene-actions button{font:inherit}
</style></head><body><main>
<h1>Illustration catalog</h1><p id="status" role="status">Connecting to plugin...</p>
<section class="controls" aria-label="Composition presets"><label>Format<select id="format"><option value="S">S</option><option value="L">L</option></select></label><label>Template<select id="template"></select></label><label>Role<select id="role"><option value="main">main</option><option value="background">background</option></select></label></section>
<input id="search" type="search" placeholder="Search by name or tag" aria-label="Search illustrations"><section id="catalog" aria-label="Illustration catalog"></section><button id="insert" type="button" disabled>Add selected illustration</button><section id="scene" aria-label="Scene editor"><h2>Scene</h2><div id="scene-items"></div></section>
</main><script>
const manifest=/* ASSET_MANIFEST */,templateManifest=/* TEMPLATE_MANIFEST */;
const status=document.getElementById("status"),search=document.getElementById("search"),catalog=document.getElementById("catalog"),insert=document.getElementById("insert"),sceneItems=document.getElementById("scene-items"),formatControl=document.getElementById("format"),templateControl=document.getElementById("template"),roleControl=document.getElementById("role");
const templateNames={compact:"Собранно",offset:"Со смещением",headline:"Под заголовок"},safe={minX:60,maxX:1140,minY:50,maxY:580},presetPositions={compact:[{x:410,y:190},{x:610,y:270},{x:300,y:330}],offset:[{x:690,y:125},{x:245,y:300},{x:755,y:390}],headline:[{x:745,y:320},{x:365,y:390},{x:880,y:440}]};
let selectedAssetId=null,applyRequestId=null,selectedItemId=null,scene={format:"S",paletteId:"",templateId:"compact_S",items:[]};
const assetFor=id=>manifest.assets.find(asset=>asset.id===id),itemId=()=>"item-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),variantFor=role=>`${scene.format==="L"?"large":"small"}_${role}`,kindFor=()=>scene.templateId.replace(/_[LS]$/,""),templateFor=(kind,format=scene.format)=>`${kind}_${format}`;
const matchesSearch=(asset,query)=>[asset.name,asset.id,...asset.tags].join(" ").toLocaleLowerCase().includes(query.trim().toLocaleLowerCase());
const normalizeScene=()=>scene.items.sort((a,b)=>a.zIndex-b.zIndex).forEach((item,index)=>item.zIndex=index);
const bounded=(value,min,max)=>Math.min(max,Math.max(min,Number(value)||0));
function positionItems(){const positions=presetPositions[kindFor()];scene.items.forEach((item,index)=>Object.assign(item,positions[index%positions.length]));}
function renderControls(){formatControl.value=scene.format;templateControl.replaceChildren();templateManifest.templates.filter(template=>template.format===scene.format).forEach(template=>{const option=document.createElement("option");option.value=template.id;option.textContent=templateNames[template.kind];option.selected=template.id===scene.templateId;templateControl.append(option)});if(!templateControl.value){scene.templateId=templateFor("compact");templateControl.value=scene.templateId}}
function updateInsertButton(){insert.disabled=!selectedAssetId||Boolean(applyRequestId)}
function renderCatalog(){const assets=manifest.assets.filter(asset=>matchesSearch(asset,search.value));catalog.replaceChildren();assets.forEach(asset=>{const card=document.createElement("article"),isSelected=selectedAssetId===asset.id,variant=variantFor(roleControl.value);card.className="asset";card.tabIndex=0;card.setAttribute("aria-selected",String(isSelected));const preview=document.createElement("img");preview.className="preview";preview.alt=asset.name;preview.src=asset.variants[variant].file;card.append(preview);const details=document.createElement("div");details.innerHTML="<div class=asset-name></div><div class=tags></div><div class=variants></div>";details.querySelector(".asset-name").textContent=asset.name;details.querySelector(".tags").textContent=asset.tags.join(" · ");["main","background"].forEach(role=>{const button=document.createElement("button");button.className="variant";button.type="button";button.textContent=role;button.setAttribute("aria-pressed",String(role===roleControl.value));button.addEventListener("click",event=>{event.stopPropagation();roleControl.value=role;renderCatalog()});details.querySelector(".variants").append(button)});card.append(details);card.addEventListener("click",()=>{selectedAssetId=asset.id;status.textContent=`Selected: ${asset.name}`;renderCatalog()});catalog.append(card)});updateInsertButton()}
function renderScene(){sceneItems.replaceChildren();if(!scene.items.length){sceneItems.textContent="No items yet.";return}scene.items.forEach((item,index)=>{const row=document.createElement("article");row.className="scene-item"+(item.id===selectedItemId?" selected":"");const title=document.createElement("strong");title.textContent=`${assetFor(item.assetId).name} — ${item.role}`;row.append(title);row.addEventListener("click",()=>{selectedItemId=item.id;renderScene()});const fields=document.createElement("div");fields.className="coordinates";[["X","x",safe.minX,safe.maxX],["Y","y",safe.minY,safe.maxY],["°","rotation",-360,360]].forEach(([label,key,min,max])=>{const field=document.createElement("label"),input=document.createElement("input");field.textContent=label;input.type="number";input.value=item[key];input.addEventListener("change",()=>{item[key]=bounded(input.value,min,max);input.value=item[key];applyScene()});field.append(input);fields.append(field)});const role=document.createElement("select");["main","background"].forEach(value=>{const option=document.createElement("option");option.value=value;option.textContent=value;option.selected=item.role===value;role.append(option)});role.addEventListener("change",()=>{item.role=role.value;applyScene()});fields.append(role);row.append(fields);const actions=document.createElement("div");actions.className="scene-actions";[["Duplicate",()=>{const copy={...item,id:itemId(),zIndex:scene.items.length};scene.items.push(copy);selectedItemId=copy.id}], ["Delete",()=>{scene.items=scene.items.filter(candidate=>candidate.id!==item.id);if(selectedItemId===item.id)selectedItemId=null}], ["Back",()=>{if(index)[scene.items[index-1],scene.items[index]]=[scene.items[index],scene.items[index-1]]}], ["Forward",()=>{if(index<scene.items.length-1)[scene.items[index+1],scene.items[index]]=[scene.items[index],scene.items[index+1]]}]].forEach(([label,handler])=>{const button=document.createElement("button");button.type="button";button.textContent=label;button.addEventListener("click",event=>{event.stopPropagation();handler();normalizeScene();renderScene();applyScene()});actions.append(button)});row.append(actions);sceneItems.append(row)})}
async function svgByItemId(){return Object.fromEntries(await Promise.all(scene.items.map(async item=>{const response=await fetch(assetFor(item.assetId).variants[variantFor(item.role)].file);if(!response.ok)throw new Error("A scene SVG could not be read.");return[item.id,await response.text()]})))}
async function applyScene(){if(applyRequestId)return;const requestId="scene-"+Date.now();applyRequestId=requestId;updateInsertButton();try{parent.postMessage({pluginMessage:{type:"applyScene",requestId,scene,svgByItemId:await svgByItemId()}},"*");status.textContent="Updating scene..."}catch(error){applyRequestId=null;updateInsertButton();status.textContent=error instanceof Error?error.message:"Could not prepare the scene."}}
formatControl.addEventListener("change",()=>{scene.format=formatControl.value;scene.templateId=templateFor(kindFor());positionItems();renderControls();renderCatalog();renderScene();applyScene()});templateControl.addEventListener("change",()=>{scene.templateId=templateControl.value;positionItems();renderScene();applyScene()});roleControl.addEventListener("change",renderCatalog);search.addEventListener("input",renderCatalog);insert.addEventListener("click",()=>{const asset=assetFor(selectedAssetId);if(!asset||applyRequestId)return;const position=presetPositions[kindFor()][scene.items.length%3];const item={id:itemId(),assetId:asset.id,role:roleControl.value,x:position.x,y:position.y,rotation:0,zIndex:scene.items.length};scene.items.push(item);selectedItemId=item.id;renderScene();applyScene()});
renderControls();renderCatalog();renderScene();const pingId="ping-"+Date.now();parent.postMessage({pluginMessage:{type:"ping",requestId:pingId}},"*");parent.postMessage({pluginMessage:{type:"initialize",requestId:"initialize-"+Date.now()}},"*");window.onmessage=event=>{const message=event.data.pluginMessage;if(message&&message.type==="pong"&&message.requestId===pingId)status.textContent="Connected to plugin";if(message&&message.type==="sceneLoaded"){scene=message.scene;if(!templateManifest.templates.some(template=>template.id===scene.templateId&&template.format===scene.format)){scene.templateId=templateFor("compact");positionItems()}renderControls();renderCatalog();renderScene();status.textContent="Scene restored from plugin storage."}if(message&&message.requestId===applyRequestId&&message.type==="sceneApplied"){applyRequestId=null;scene=message.scene;updateInsertButton();renderControls();renderScene();status.textContent="Scene saved to plugin storage."}if(message&&message.requestId===applyRequestId&&message.type==="error"){applyRequestId=null;updateInsertButton();status.textContent=message.message||"Could not update the scene."}};
</script></body></html>
