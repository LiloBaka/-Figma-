<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Illustration Builder</title><style>
body{margin:0;color:#1e1e1e;font:12px/1.4 Inter,sans-serif}main{display:grid;gap:10px;padding:16px}h1{font-size:18px;margin:0}h2{font-size:14px;margin:0}#status{color:#0f7b3b;margin:0}#search{border:1px solid #b3b3b3;border-radius:6px;box-sizing:border-box;font:inherit;padding:8px;width:100%}#catalog{display:grid;gap:8px;max-height:190px;overflow-y:auto}.asset{align-items:center;border:1px solid #e0e0e0;border-radius:6px;cursor:pointer;display:grid;gap:8px;grid-template-columns:82px 1fr;padding:8px}.asset[aria-selected="true"],.scene-item.selected{border-color:#7864d7;box-shadow:0 0 0 1px #7864d7}.preview{height:58px;object-fit:contain;width:82px}.asset-name{font-weight:600}.tags{color:#666;margin:2px 0 6px}.variants,.scene-actions,.coordinates{display:flex;flex-wrap:wrap;gap:4px}.variant{background:#f4f3fb;border:0;border-radius:4px;color:#3e3472;cursor:pointer;font:inherit;padding:4px 6px}.variant[aria-pressed="true"]{background:#7864d7;color:#fff}#insert{background:#7864d7;border:0;border-radius:6px;color:#fff;cursor:pointer;font:inherit;font-weight:600;padding:10px;width:100%}#insert:disabled{background:#c9c5df;cursor:not-allowed}#scene{border-top:1px solid #e0e0e0;padding-top:10px}.scene-item{border:1px solid #e0e0e0;border-radius:5px;display:grid;gap:5px;margin:6px 0;padding:6px}.coordinates label{display:grid;gap:2px}.coordinates input{width:55px}.scene-actions button{font:inherit}
</style></head><body><main>
<h1>Illustration catalog</h1><p id="status" role="status">Connecting to plugin...</p><input id="search" type="search" placeholder="Search by name or tag" aria-label="Search illustrations"><section id="catalog" aria-label="Illustration catalog"></section><button id="insert" type="button" disabled>Add selected illustration</button><section id="scene" aria-label="Scene editor"><h2>Scene</h2><div id="scene-items"></div></section>
</main><script>
const manifest=/* ASSET_MANIFEST */;const status=document.getElementById("status"),search=document.getElementById("search"),catalog=document.getElementById("catalog"),insert=document.getElementById("insert"),sceneItems=document.getElementById("scene-items");let selectedAssetId=null,selectedVariant="small_main",applyRequestId=null,selectedItemId=null;let scene={format:"S",paletteId:"",templateId:"",items:[]};const assetFor=id=>manifest.assets.find(asset=>asset.id===id),selectedAsset=()=>assetFor(selectedAssetId),itemId=()=>"item-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),roleFromVariant=variant=>variant.endsWith("_background")?"background":"main",updateInsertButton=()=>insert.disabled=!selectedAssetId||Boolean(applyRequestId),normalizeScene=()=>{scene.items.sort((a,b)=>a.zIndex-b.zIndex).forEach((item,index)=>item.zIndex=index)},matchesSearch=(asset,query)=>[asset.name,asset.id,...asset.tags].join(" ").toLocaleLowerCase().includes(query.trim().toLocaleLowerCase());
function renderCatalog(){const assets=manifest.assets.filter(asset=>matchesSearch(asset,search.value));catalog.replaceChildren();assets.forEach(asset=>{const card=document.createElement("article"),isSelected=selectedAssetId===asset.id,variantName=isSelected?selectedVariant:"small_main";card.className="asset";card.tabIndex=0;card.setAttribute("aria-selected",String(isSelected));const preview=document.createElement("img");preview.className="preview";preview.alt=asset.name;preview.src=asset.variants[variantName].file;card.append(preview);const details=document.createElement("div");details.innerHTML="<div class=asset-name></div><div class=tags></div><div class=variants></div>";details.querySelector(".asset-name").textContent=asset.name;details.querySelector(".tags").textContent=asset.tags.join(" · ");Object.keys(asset.variants).forEach(key=>{const button=document.createElement("button");button.className="variant";button.type="button";button.textContent=key.replace("_"," / ");button.setAttribute("aria-pressed",String(isSelected&&key===selectedVariant));button.addEventListener("click",event=>{event.stopPropagation();selectedAssetId=asset.id;selectedVariant=key;status.textContent=`Selected: ${asset.name}`;renderCatalog()});details.querySelector(".variants").append(button)});card.append(details);card.addEventListener("click",()=>{selectedAssetId=asset.id;selectedVariant="small_main";renderCatalog()});catalog.append(card)});updateInsertButton()}
function renderScene(){sceneItems.replaceChildren();if(!scene.items.length){sceneItems.textContent="No items yet.";return}scene.items.forEach((item,index)=>{const row=document.createElement("article");row.className="scene-item"+(item.id===selectedItemId?" selected":"");const title=document.createElement("strong");title.textContent=`${assetFor(item.assetId).name} — ${item.role}`;row.append(title);row.addEventListener("click",()=>{selectedItemId=item.id;renderScene()});const fields=document.createElement("div");fields.className="coordinates";[["X","x"],["Y","y"],["°","rotation"]].forEach(([label,key])=>{const field=document.createElement("label"),input=document.createElement("input");field.textContent=label;input.type="number";input.value=item[key];input.addEventListener("change",()=>{item[key]=Number(input.value)||0;applyScene()});field.append(input);fields.append(field)});row.append(fields);const actions=document.createElement("div");actions.className="scene-actions";[["Duplicate",()=>{const copy={...item,id:itemId(),x:item.x+24,y:item.y+24,zIndex:scene.items.length};scene.items.push(copy);selectedItemId=copy.id}],["Delete",()=>{scene.items=scene.items.filter(candidate=>candidate.id!==item.id);if(selectedItemId===item.id)selectedItemId=null}],["Back",()=>{if(index)[scene.items[index-1],scene.items[index]]=[scene.items[index],scene.items[index-1]]}],["Forward",()=>{if(index<scene.items.length-1)[scene.items[index+1],scene.items[index]]=[scene.items[index],scene.items[index+1]]}]].forEach(([label,handler])=>{const button=document.createElement("button");button.type="button";button.textContent=label;button.addEventListener("click",event=>{event.stopPropagation();handler();normalizeScene();renderScene();applyScene()});actions.append(button)});row.append(actions);sceneItems.append(row)})}
async function svgByItemId(){return Object.fromEntries(await Promise.all(scene.items.map(async item=>{const variant=`${scene.format==="L"?"large":"small"}_${item.role}`,response=await fetch(assetFor(item.assetId).variants[variant].file);if(!response.ok)throw new Error("A scene SVG could not be read.");return[item.id,await response.text()]})))}async function applyScene(){if(applyRequestId)return;const requestId="scene-"+Date.now();applyRequestId=requestId;updateInsertButton();try{parent.postMessage({pluginMessage:{type:"applyScene",requestId,scene,svgByItemId:await svgByItemId()}},"*");status.textContent="Updating scene..."}catch(error){applyRequestId=null;updateInsertButton();status.textContent=error instanceof Error?error.message:"Could not prepare the scene."}}
search.addEventListener("input",renderCatalog);insert.addEventListener("click",()=>{const asset=selectedAsset();if(!asset||applyRequestId)return;scene.format=selectedVariant.startsWith("large_")?"L":"S";const item={id:itemId(),assetId:asset.id,role:roleFromVariant(selectedVariant),x:scene.items.length*24,y:scene.items.length*24,rotation:0,zIndex:scene.items.length};scene.items.push(item);selectedItemId=item.id;renderScene();applyScene()});renderCatalog();renderScene();const pingId="ping-"+Date.now();parent.postMessage({pluginMessage:{type:"ping",requestId:pingId}},"*");parent.postMessage({pluginMessage:{type:"initialize",requestId:"initialize-"+Date.now()}},"*");window.onmessage=event=>{const message=event.data.pluginMessage;if(message&&message.type==="pong"&&message.requestId===pingId)status.textContent="Connected to plugin";if(message&&message.type==="sceneLoaded"){scene=message.scene;renderScene();status.textContent="Scene restored from plugin storage."}if(message&&message.requestId===applyRequestId&&message.type==="sceneApplied"){applyRequestId=null;scene=message.scene;updateInsertButton();renderScene();status.textContent="Scene saved to plugin storage."}if(message&&message.requestId===applyRequestId&&message.type==="error"){applyRequestId=null;updateInsertButton();status.textContent=message.message||"Could not update the scene."}};
</script></body></html>
